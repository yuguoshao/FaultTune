# Builds the Python wheels (one abi3 wheel per platform covers Python 3.11 and newer) and the
# source distribution, tests the wheels that can run on the build machine, and publishes
# everything to PyPI when a version tag is pushed.
#
# Based on the output of `maturin generate-ci github`, adapted to this repository: the
# extension crate is crates/faulttune-py and pyproject.toml at the repository root names it
# (`[tool.maturin] manifest-path`), so every maturin command runs from the repository root
# without `--manifest-path`.
#
# Publishing uses PyPI trusted publishing (OpenID Connect), so no API token is stored. One-time
# setup on PyPI (project "faulttune" -> Publishing): add a trusted publisher for this GitHub
# repository with workflow name `release.yml` and environment name `pypi`.
#
# To release: set the version in Cargo.toml (`[workspace.package] version`), push a tag
# `v<version>` (for example `git tag v0.1.0 && git push origin v0.1.0`), then run this workflow
# by hand with that tag selected as the ref: from the Actions tab ("Run workflow", "Use workflow
# from" -> Tags -> the tag) or with `gh workflow run release.yml --ref v0.1.0`. Pushing the tag
# does not start anything by itself. A manual run on a branch builds and tests everything but
# never publishes.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Wheel (manylinux ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test the wheel
        # Only the x86_64 wheel can run on this (x86_64) machine.
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install numpy pytest nbformat
          python -m pip install faulttune --no-index --find-links dist
          python -m pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist

  macos:
    name: Wheel (macOS ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install numpy pytest nbformat
          python -m pip install faulttune --no-index --find-links dist
          python -m pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Wheel (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          python -m pip install numpy pytest nbformat
          python -m pip install faulttune --no-index --find-links dist
          python -m pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test the package from the sdist
        # The sdist must be self-contained: build the extension from it (the runner has a Rust
        # toolchain) and run the tests against that build.
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install numpy pytest nbformat
          python -m pip install dist/*.tar.gz
          python -m pytest python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/faulttune
    permissions:
      # Trusted publishing: exchange the workflow's OpenID Connect token for a PyPI upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match the package version v{version}")
          print(f"releasing {tag}")
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: List the distributions
        run: ls -l dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
