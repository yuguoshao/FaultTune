[package]
name = "faulttune-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Python bindings (PyO3) for FaultTune"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# Needed to build the Python extension module (maturin enables it through pyproject.toml);
# left off by default so that `cargo test`/`cargo clippy` link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
faulttune = { path = "../faulttune" }
# `abi3-py311`: one wheel per platform for every Python >= 3.11.
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
rand = "0.9"
